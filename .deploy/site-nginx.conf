# Dentro il container del sito. TLS, HSTS e rate limiting sono gestiti un hop
# più su dall'nginx di edge: questo server block serve solo file.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    location ~* \.(css|js|woff2?|ttf|eot|ico|png|jpe?g|gif|svg|webp|avif)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    location ~* \.html$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    location / {
        # Nessun router client-side: una sola pagina, quindi niente fallback su
        # /index.html e `=404` resta, così un path inventato dà 404 e non un
        # 200 con dentro il gioco.
        try_files $uri $uri/ $uri.html =404;
    }

    location ~ /\. {
        deny all;
    }
}
