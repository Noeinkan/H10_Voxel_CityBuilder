# voxelcity — voxelcity.77.42.70.26.nip.io
# Generato dal skill `hetzner-site` da templates/vhost.conf.tpl.
# Non modificarlo sul server: site-deploy.sh lo sovrascrive dalla copia in repo.

# HTTP — solo la challenge ACME, tutto il resto redirige a HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name voxelcity.77.42.70.26.nip.io;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — proxy verso il container del sito sulla rete condivisa `edge`.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name voxelcity.77.42.70.26.nip.io;

    ssl_certificate     /etc/letsencrypt/live/voxelcity.77.42.70.26.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/voxelcity.77.42.70.26.nip.io/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 4m;
    limit_req zone=site_limit burst=40 nodelay;

    # Upstream tenuto in una variabile perché il resolver a livello http
    # (00-sites.conf) lo risolva per richiesta. Un container fermo dà 502 solo
    # per questo host: non può impedire a nginx di partire e tirare giù Capsar.
    set $upstream_voxelcity "site-voxelcity-web:8080";

    location / {
        proxy_pass         http://$upstream_voxelcity;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_read_timeout 60s;
    }

    # Mai servire dotfile (.git, .env, avanzi dell'editor) nemmeno per sbaglio.
    location ~ /\.(?!well-known) {
        deny all;
    }
}
