# voxelcity — voxelcity.77.42.70.26.nip.io (vhost di bootstrap, solo HTTP)
# Installato da site-deploy.sh *solo* mentre viene emesso il primo certificato,
# poi sostituito dal vhost HTTPS vero. Serve nient'altro che la challenge ACME,
# così il sito non è mai raggiungibile in chiaro.
server {
    listen 80;
    listen [::]:80;
    server_name voxelcity.77.42.70.26.nip.io;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 503;
    }
}
